        <!-- Imagen 3 -->
        <div class="galeria-item">

<style>
    .galeria {
        width: 90%;
        max-width: 1200px;
        margin: 50px auto;
        text-align: center;
    }

    .galeria > h2 {
        font-size: 30px;
        margin-bottom: 35px;
        color:#2980b9;
    }

    .galeria-contenedor {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
    }

    .galeria-item {
        background-color: white;
        padding: 18px;
        border-radius: 15px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        border: 1px solid #ddd;
    }

    .galeria-item h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
        font-size: 19px;
    }

    .imagen-caja {
        width: 100%;
        height: 220px;
        border-radius: 10px;
        overflow: hidden;
        background-color: #f1f1f1;
    }

    .imagen-caja img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }

    /* Efecto al pasar el mouse */
    .imagen-caja img:hover {
        transform: scale(1.05);
    }

    /* Tablets */
    @media (max-width: 900px) {
        .galeria-contenedor {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Celulares */
    @media (max-width: 550px) {
        .galeria-contenedor {
            grid-template-columns: 1fr;
        }
    }
</style>
